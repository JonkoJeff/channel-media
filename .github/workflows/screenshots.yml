name: screenshots
on:
  push:
    paths: ["studio/channels/*/shots.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node studio/shots/shoot.js
      - run: |
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add studio/channels/*/shots && git commit -m "Screenshots [skip ci]" && git push || true
