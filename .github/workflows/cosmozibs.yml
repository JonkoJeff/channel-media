name: cosmozibs
# Cosmozibs: episode JSON (studio/cosmozibs/episodes/czNN.json, written by Codex) -> 8-min video + 4 Shorts + thumbnail + 4 covers
# -> release czNN + studio/renders/czNN/result.json (same shape as the other channels, so zernio.yml can post it). No Claude tokens.
on:
  workflow_dispatch:
    inputs:
      ep: {description: "Episode id, e.g. cz01", required: true}
      mode: {description: "full | tiktok (Faith Doodles TikTok, studio/channels/faith/episodes) | clips (only the TikTok-only clips of an already rendered episode) | voicetest (Chatterbox voice samples)", required: false, default: full}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04   # ubuntu-latest = Ubuntu 26 since 19 Oct 2026: playwright --with-deps fails there
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: studio/voice/*.onnx, key: kokoro-v1}
      - uses: actions/cache@v4
        with: {path: studio/voice/voices.bin, key: kokoro-voices-v1}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg && pip install onnxruntime numpy scipy pillow
      - run: bash studio/setup.sh
      - name: browser
        if: inputs.mode != 'voicetest'
        working-directory: studio/cosmozibs/engine
        run: npm i --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: natural voices (Chatterbox, owner 20 Oct)
        if: inputs.mode != 'voicetest'
        run: pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install chatterbox-tts
      - name: validate
        if: inputs.mode != 'voicetest' && inputs.mode != 'tiktok'
        run: python3 studio/cosmozibs/engine/validate.py studio/cosmozibs/episodes/${{ inputs.ep }}.json
      - name: render
        if: inputs.mode != 'voicetest'
        env: {VOICE_ENGINE: chatterbox}
        run: bash studio/cosmozibs/engine/build.sh ${{ inputs.ep }} 4 ${{ inputs.mode || 'full' }}
      - name: publish Faith Doodles TikTok
        if: inputs.mode == 'tiktok'
        run: |
          ID=${{ inputs.ep }}; mkdir -p studio/channels/faith/videos && cp studio/cosmozibs/engine/build/$ID/${ID}_tiktok.mp4 studio/channels/faith/videos/$ID.mp4
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add -f studio/channels/faith/videos/$ID.mp4 && git commit -qm "Faith Doodles $ID [skip ci]" && for k in 1 2 3 4 5; do git pull -q --rebase && git push && exit 0; sleep 8; done; exit 1
      - name: voice test (Chatterbox)
        if: inputs.mode == 'voicetest'
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu && pip install chatterbox-tts
          python3 - <<'PY'
          import json
          ep = json.load(open("studio/cosmozibs/episodes/cz03.json")); segs = {s["id"]: s for s in ep["segments"]}
          wow = dict(segs["wow"]); wow.pop("short"); wow["lines"] = wow["lines"][:8]
          json.dump({"id": "czvt", "title": "voice test", "segments": [segs["intro"], wow]}, open("/tmp/czvt.json", "w"))
          PY
          time VOICE_ENGINE=chatterbox python3 studio/cosmozibs/engine/voice.py /tmp/czvt.json
          mkdir -p studio/channels/faith/voice_tests && ffmpeg -y -loglevel error -i studio/cosmozibs/engine/build/czvt/long.wav -c:a libmp3lame -q:a 3 studio/channels/faith/voice_tests/cosmozibs_crew_test.mp3
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add -f studio/channels/faith/voice_tests && git commit -qm "voice test samples [skip ci]" && for k in 1 2 3 4 5; do git pull -q --rebase && git push && exit 0; sleep 8; done; exit 1
      - name: publish TikTok clips only
        if: inputs.mode == 'clips'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          ID=${{ inputs.ep }}; B=studio/cosmozibs/engine/build/$ID; mkdir -p out
          for f in $B/${ID}_clip_*.mp4; do s=$(basename $f .mp4); cp $f out/${ID}_tt_${s#${ID}_clip_}.mp4; done
          gh release upload $ID out/*.mp4 --clobber
          python3 - <<'PY'
          import json
          i = "${{ inputs.ep }}"; f = f"studio/renders/{i}/result.json"; r = json.load(open(f)); rel = f"https://github.com/JonkoJeff/channel-media/releases/download/{i}/"
          cl = json.load(open(f"studio/cosmozibs/engine/build/{i}/clips.json"))
          r["tiktok_clips"] = {f"{i}_tt_{c['id']}": rel + f"{i}_tt_{c['id']}.mp4" for c in cl}; r["tiktok_meta"] = {f"{i}_tt_{c['id']}": {"title": c["title"], "kw": c.get("kw", "")} for c in cl}
          json.dump(r, open(f, "w"), indent=1)
          PY
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add -f studio/renders/$ID/result.json && git commit -qm "TikTok clips $ID [skip ci]" && for k in 1 2 3 4 5; do git pull -q --rebase && git push && exit 0; sleep 8; done; exit 1
      - name: publish release + result files
        if: inputs.mode != 'clips' && inputs.mode != 'voicetest' && inputs.mode != 'tiktok'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          ID=${{ inputs.ep }}; B=studio/cosmozibs/engine/build/$ID
          python3 - <<'PY'
          import json, os, shutil
          i = os.environ.get("ID") or "${{ inputs.ep }}"; B = f"studio/cosmozibs/engine/build/{i}"; ep = json.load(open(f"studio/cosmozibs/episodes/{i}.json"))
          d = f"studio/renders/{i}"; os.makedirs(d, exist_ok=True); art = f"studio/channels/cosmozibs/thumbs/{i}.jpg"; shutil.copy(art if os.path.exists(art) else f"{B}/thumbs/{i}_long.jpg", d + "/thumb.jpg")   # Codex-painted thumbnail wins (owner 19 Oct), drawn one is the fallback
          tl = json.load(open(f"{B}/long.json")); rel = f"https://github.com/JonkoJeff/channel-media/releases/download/{i}/"
          # chapters from the timeline: first line of every segment
          seen, ch = set(), []
          for l in tl["lines"]:
              if l["seg"] not in seen:
                  seen.add(l["seg"]); t = max(0, int(l["start"] - .5)); name = {"intro": "Intro", "speed": "Speed round", "outro": "Your turn!"}.get(l["seg"])
                  if not name: name = next(s["short"]["title"] for s in ep["segments"] if s["id"] == l["seg"])
                  ch.append(f"{t // 60}:{t % 60:02d} {name}")
          ch[0] = "0:00 " + ch[0].split(" ", 1)[1]
          desc = ep.get("description", ep["title"]).replace("{{chapters}}", "\n".join(ch))
          if "{{chapters}}" not in ep.get("description", "{{chapters}}") and "0:00" not in desc: desc += "\n\n" + "\n".join(ch)
          desc += "\n\nSources:\n" + "\n".join(ep["sources"]) if "Sources:" not in desc else ""
          open(d + "/description.txt", "w").write(desc)
          shorts, meta, sj = {}, {}, "studio/assetedit/videos/shorts.json"; allm = json.load(open(sj)) if os.path.exists(sj) else []
          for s in ep["segments"]:
              if "short" not in s: continue
              sid = f"{i}_{s['id']}"; shorts[sid] = rel + sid + ".mp4"; meta[sid] = {"title": s["short"]["title"]}
              os.path.exists(f"studio/covers/{sid}.jpg") or shutil.copy(f"{B}/thumbs/{i}_short_{s['id']}.jpg", f"studio/covers/{sid}.jpg")   # keep a Codex-painted cover
              allm = [x for x in allm if x.get("id") != sid] + [{"id": sid, "title": s["short"]["title"], "tags": ["#space", "#spacefacts", "#shorts"]}]
          json.dump(allm, open(sj, "w"), indent=1)
          cl = json.load(open(f"{B}/clips.json")) if os.path.exists(f"{B}/clips.json") else []
          json.dump({"id": i, "video": rel + i + ".mp4", "thumb": "https://raw.githubusercontent.com/JonkoJeff/channel-media/main/" + d + "/thumb.jpg", "shorts": shorts, "shorts_meta": meta,
                     "tiktok_clips": {f"{i}_tt_{c['id']}": rel + f"{i}_tt_{c['id']}.mp4" for c in cl}, "tiktok_meta": {f"{i}_tt_{c['id']}": {"title": c["title"], "kw": c.get("kw", "")} for c in cl}}, open(d + "/result.json", "w"), indent=1)
          json.dump({"id": i, "title": ep["title"], "channel": "cosmozibs", "tags": ep.get("tags", []) + ["Cosmozibs", "space for kids", "space facts"], "playlists": [ep.get("theme", "")]}, open(f"studio/assetedit/videos/{i}.json", "w"), indent=1)
          PY
          mkdir -p out && cp $B/${ID}_long.mp4 out/$ID.mp4 && for f in $B/${ID}_short_*.mp4; do s=$(basename $f .mp4); cp $f out/${ID}_${s#${ID}_short_}.mp4; done && for f in $B/${ID}_clip_*.mp4; do s=$(basename $f .mp4); cp $f out/${ID}_tt_${s#${ID}_clip_}.mp4; done
          gh release delete $ID -y --cleanup-tag 2>/dev/null || true
          gh release create $ID out/*.mp4 --title "$ID" --notes "Cosmozibs $ID rendered files."
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add -f studio/renders/$ID studio/assetedit/videos/$ID.json studio/assetedit/videos/shorts.json studio/covers/${ID}_*.jpg && git commit -qm "Rendered $ID [skip ci]" && for k in 1 2 3 4 5; do git pull -q --rebase && git push && exit 0; sleep 8; done; exit 1
