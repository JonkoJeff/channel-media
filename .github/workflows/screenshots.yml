name: screenshots
on:
  workflow_dispatch:
    inputs:
      urls: {description: "Space-separated public URLs", required: true}
      name: {description: "File name prefix", default: "shot"}
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node studio/shots/shoot.js "${{ inputs.name }}" ${{ inputs.urls }}
      - run: |
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add studio/shots/*.png && git commit -m "Screenshots: ${{ inputs.name }} [skip ci]" && git push || true
