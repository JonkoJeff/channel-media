name: screenshots
on:
  push:
    paths: ["studio/channels/*/shots.json", "studio/channels/*/photos.json", "studio/assetedit/photos.json"]
  workflow_dispatch:
    inputs:
      fallback: {description: "Use Openverse photos when the AI quota is used up (check the contact sheet!)", required: false, default: ""}
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node studio/shots/shoot.js
      - run: python3 studio/shots/photos.py
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || '21512b529b386555222317db76ce194e' }}  # not a secret, just the account number
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OPENVERSE_FALLBACK: ${{ inputs.fallback }}
      - run: |
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add -A studio/channels studio/assetedit && git commit -m "Screenshots [skip ci]" && git pull --rebase -q && git push || true
