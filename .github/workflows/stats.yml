name: hub-stats
# Every 15 min: fresh YouTube numbers (YouTube Data API, ~3 quota units per run) -> studio/yt/status.json + hub/data.json for the screen hub.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *'   # daily (owner 14 Oct: grow per video). Zero Claude tokens, ~3 YouTube quota units
permissions:
  contents: write
  actions: read
concurrency: hub-stats
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-api-python-client google-auth
      - run: python studio/yt/upload.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHECK_ONLY: '1'
      - run: python studio/yt/hubdata.py
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add studio/yt/status.json hub/data.json hub/history.json && git commit -qm "Hub stats" && git pull --rebase --autostash -q && git push -q
