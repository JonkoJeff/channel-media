name: religion
# Belief Through Time: script (studio/channels/religion/stories/NN.txt) -> ~1 h documentary + 4 Shorts -> release rel<NN> (+ result.json for zernio.yml). No Claude tokens.
on:
  workflow_dispatch:
    inputs:
      ep: {description: "Episode number as in the file name (01..30, 301..310) or 'test'", required: true}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: {path: studio/voice/*.onnx, key: kokoro-v1}
      - uses: actions/cache@v4
        with: {path: studio/voice/voices.bin, key: kokoro-voices-v1}
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core && pip install onnxruntime numpy scipy pillow
      - run: bash studio/setup.sh
      - name: thumbnail exists?
        run: |
          E=${{ inputs.ep }}; [ "$E" = test ] && { echo "THUMB=studio/channels/religion/thumbs/Q01.jpg" >> $GITHUB_ENV; exit 0; }; N=$((10#$E))
          T=""; if [ $N -le 10 ]; then T=$(ls studio/channels/religion/thumbs/bible_$(printf %02d $N)_*.jpg 2>/dev/null | head -1); elif [ $N -ge 21 ] && [ $N -le 30 ]; then T=studio/channels/religion/thumbs/Q$(printf %02d $((N-20))).jpg; fi
          [ -f "$T" ] || T=studio/channels/religion/thumbs/$E.jpg   # 301-310, or painted by Codex (factory rel_thumb), e.g. 11.jpg
          test -f "$T" && echo "THUMB=$T" >> $GITHUB_ENV || echo "::warning::no thumbnail art for episode $N: build.py draws its own (the schedule never waits for art)"
      - name: build
        run: |
          E=${{ inputs.ep }}; F=studio/channels/religion/stories/$E.txt; ID=rel$E
          [ "$E" = test ] && F=studio/religion/fixtures/test.txt && ID=reltest
          echo "ID=$ID" >> $GITHUB_ENV
          python3 studio/religion/build.py $F $ID > build.log 2>&1 || { echo "::error::$(tail -c 1500 build.log | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(tail -n 1 build.log)"
      - name: test preview (frames committed for review)
        if: inputs.ep == 'test'
        run: |
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/reltest.mp4)
          for i in $(seq 0 11); do ffmpeg -loglevel error -y -ss $(python3 -c "print(int($D*($i+0.5)/12))") -i out/reltest.mp4 -frames:v 1 -vf scale=480:270 /tmp/f$i.jpg; done
          ffmpeg -loglevel error -y -i /tmp/f%d.jpg -vf tile=4x3 -frames:v 1 studio/religion/fixtures/preview.jpg
          ffmpeg -loglevel error -y -t 75 -i out/reltest.mp4 -vn -c:a libmp3lame -b:a 128k studio/religion/fixtures/voice_test.mp3   # owner listens to the new voice
          [ -f out/thumb.jpg ] && cp out/thumb.jpg studio/religion/fixtures/thumb_test.jpg
          S=out/reltest_s1.mp4; if [ -f $S ]; then SD=$(ffprobe -v error -show_entries format=duration -of csv=p=0 $S); for i in 0 1 2 3 4 5; do ffmpeg -loglevel error -y -ss $(python3 -c "print(round(0.8+($SD-1.5)*$i/5,2))") -i $S -frames:v 1 -vf scale=270:480 /tmp/v$i.jpg; done; ffmpeg -loglevel error -y -i /tmp/v%d.jpg -vf tile=6x1 -frames:v 1 studio/religion/fixtures/short_preview.jpg; fi   # Short: cover, captions, vertical framing
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com; git add -f studio/religion/fixtures/preview.jpg studio/religion/fixtures/voice_test.mp3 studio/religion/fixtures/thumb_test.jpg studio/religion/fixtures/short_preview.jpg 2>/dev/null; git commit -qm "test preview, voice sample, thumbnail [skip ci]" && git pull -q --rebase && git push
      - name: publish release + result files
        if: inputs.ep != 'test'
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          python3 - <<'PY'
          import json, os, glob
          import shutil
          i = os.environ["ID"]; m = json.load(open("out/meta.json")); d = f"studio/renders/{i}"; os.makedirs(d, exist_ok=True)
          th = os.environ.get("THUMB", "")
          if os.path.exists("out/thumb.jpg"): shutil.copy("out/thumb.jpg", d + "/thumb.jpg"); th = d + "/thumb.jpg"   # own headline thumbnail (GAP 2)
          rel = f"https://github.com/JonkoJeff/channel-media/releases/download/{i}/"
          sh = {os.path.basename(f)[:-4]: rel + os.path.basename(f) for f in sorted(glob.glob(f"out/{i}_s*.mp4"))}
          json.dump({"id": i, "video": rel + i + ".mp4", "thumb": "https://raw.githubusercontent.com/JonkoJeff/channel-media/main/" + th, "shorts": sh, "shorts_meta": m["shorts_meta"]}, open(d + "/result.json", "w"), indent=1)
          open(d + "/description.txt", "w").write(m["desc"])
          json.dump({"id": i, "title": m["title"], "channel": "religion", "tags": m["tags"], "playlists": []}, open(f"studio/assetedit/videos/{i}.json", "w"), indent=1)
          PY
          gh release delete $ID -y --cleanup-tag 2>/dev/null || true
          gh release create $ID out/$ID.mp4 $(ls out/${ID}_s*.mp4) --title "$ID" --notes "Rendered video files."
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          git add -f studio/renders/$ID studio/assetedit/videos/$ID.json && git commit -qm "Rendered $ID [skip ci]" && git pull -q --rebase && git push
