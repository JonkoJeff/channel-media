name: handle-check
on:
  workflow_dispatch:
    inputs:
      handles: {description: "Handles, comma-separated", required: true}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q google-api-python-client google-auth
      - run: python studio/yt/handles.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          HANDLES: ${{ inputs.handles }}
