name: upscale-sprites
on:
  workflow_dispatch:
    inputs:
      folders: {description: "Sprite folders, space-separated", default: "studio/assetedit/assets"}
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && pip install spandrel pillow numpy
      - run: curl -sSL -o anime6B.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.2.4/RealESRGAN_x4plus_anime_6B.pth
      - run: python3 studio/ai/upscale.py ${{ inputs.folders }} > up.log 2>&1 || { echo "::error::$(tail -c 1500 up.log | tr '\n' ' ')"; exit 1; }
      - run: |
          git config user.name channel-bot && git config user.email jeffrey.vastenhout@gmail.com
          cp -n studio/ai/upscaled/assetedit_assets/*.png studio/assetedit/assets_hd/ 2>/dev/null; cp -n studio/ai/upscaled/moneyatnight_assets/*.png studio/channels/moneyatnight/assets_hd/ 2>/dev/null; git add studio/ai/upscaled studio/assetedit/assets_hd studio/channels/moneyatnight/assets_hd && git commit -m "Upscaled sprites [skip ci]" && git pull --rebase -q && git push || true
